name: React App Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Stop Old Container
        run: docker stop react-app || true

      - name: Remove Old Container
        run: docker rm react-app || true

      - name: Build Docker Image
        run: docker build -t react-app .

      - name: Run Docker Container
        run: docker run -d -p 5173:5173 --name react-app react-app:latest
